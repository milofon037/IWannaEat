services:
  postgres:
    image: postgres:16-alpine
    container_name: iwannaeat-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iwannaeat}
      POSTGRES_USER: ${POSTGRES_USER:-iwannaeat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iwannaeat}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - iwannaeat_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iwannaeat} -d ${POSTGRES_DB:-iwannaeat}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  iwannaeat_pg_data:
